spring.application.name=doubles-tennis-analyzer


spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

#spring.datasource.url=jdbc:mysql://localhost:3306/tenis_dobles?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=montrondo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Para usar UTF-8 (opcional pero recomendado)
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

tenis.carga.inicio=2025-09-22
tenis.carga.fin=2025-09-28

allsportsapi.key=${API_KEY}
